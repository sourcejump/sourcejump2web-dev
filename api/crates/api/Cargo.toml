[package]
name = "sourcejump-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2.32"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
flate2 = "1.1.10"
# `Stream` and `stream::unfold` for the records stream's server-sent events; already built for axum.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form"] }
rusty-s3 = { version = "0.11.0", default-features = false, features = ["rustcrypto", "xml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# The map packer lives in its own public repo, so staff can read the code sj-pack runs; pinned, since
# stored viewer files must keep passing its `check`.
sourcejump-viewer-pack = { git = "https://github.com/sourcejump/sourcejump-packer", rev = "fb417acd93dc37d1482b3eb5f46086aeea939d10" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
webp = { version = "0.3.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
