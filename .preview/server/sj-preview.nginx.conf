# Preview sites at <name>-sj.okwhiteli.st, on AU next to okwhiteli.st. install.sh links this into
# /etc/nginx/sites-enabled. Cloudflare proxies a wildcard * record here. Explicit records (www, monitor, ...)
# keep going to their own server blocks, because a regex server_name only matches after the exact names miss.

# "<name> <port>;" per line, written by /usr/local/bin/sj-preview. $sjp_name comes from server_name below.
map $sjp_name $sjp_port {
    include /srv/sj-preview/ports.map;
    default 0;
}

server {
    listen 80;
    server_name ~^(?<sjp_name>[a-z0-9-]+)-sj\.okwhiteli\.st$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<sjp_name>[a-z0-9-]+)-sj\.okwhiteli\.st$;

    # Cloudflare Origin CA certificate for *.okwhiteli.st (a Let's Encrypt wildcard would need DNS-01).
    ssl_certificate     /etc/ssl/sj-preview/origin.pem;
    ssl_certificate_key /etc/ssl/sj-preview/origin.key;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    if ($sjp_port = 0) {
        return 404 "No preview with this name.\n";
    }

    # The browser calls /v1/* on the site's own origin (web/src/api/client.ts). Previews read real data from
    # the beta API but can never write to it (limit_except GET also allows HEAD). Cookies are dropped both
    # ways, so nobody signs in on preview code.
    location /v1/ {
        limit_except GET { deny all; }
        proxy_pass https://beta.sourcejump.net;
        proxy_ssl_server_name on;
        proxy_set_header Host beta.sourcejump.net;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_hide_header Set-Cookie;
    }

    location / {
        proxy_pass http://127.0.0.1:$sjp_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
